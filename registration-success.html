<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeOrbit | Registration Successful</title>
    <link rel="stylesheet" href="assets/css/design-system.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <style>
        .success-badge-large {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #ECFDF5;
            color: #10B981;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 16px;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.25);
        }
        .success-student-box {
            background: #F8FAFC;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            margin: 22px 0 28px 0;
            text-align: left;
        }
        .success-student-box h4 {
            font-size: 15.5px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .success-student-box p {
            font-size: 13.5px;
            color: var(--text-muted);
        }
    </style>
</head>

<body class="auth-body">

    <header class="auth-nav-header">
        <a href="index.html" class="app-brand" style="margin-bottom:0; padding-bottom:0; border:none;">
            <span class="brand-badge">&lt;/&gt;</span>
            <span class="brand-title">CodeOrbit</span>
        </a>

        <a href="index.html" class="btn-ghost-dark">
            ← Home
        </a>
    </header>

    <main class="auth-main-wrap">
        <div class="auth-card-container" style="text-align: center;">
            <div class="success-badge-large">✓</div>
            
            <h2 style="font-family: var(--font-heading); font-size:24px; font-weight:700; margin-bottom:8px;">
                Registration Successful!
            </h2>
            <p style="color:var(--text-muted); font-size:14.5px;">
                Welcome to the CodeOrbit Skill Exchange Community 🎉
            </p>

            <div class="success-student-box">
                <h4 id="studentName">Welcome, Khushi!</h4>
                <p id="studentSkill">Explore your favourite skills and grow together.</p>
            </div>

            <div style="display:flex; flex-direction:column; gap:12px;">
                <a href="dashboard.html" class="btn-primary" style="padding:13px; font-size:15px;">
                    Go to My Dashboard →
                </a>
                <a href="skill-match.html" class="btn-secondary" style="padding:12px;">
                    Try Peer Skill Match ✨
                </a>
            </div>
        </div>
    </main>

    <script src="assets/js/registration-success.js"></script>
</body>
</html>
