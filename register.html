<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeOrbit | Student Registration</title>
    <link rel="stylesheet" href="assets/css/design-system.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>

<body class="auth-body">

    <!-- Auth Navigation Header -->
    <header class="auth-nav-header">
        <a href="index.html" class="app-brand" style="margin-bottom:0; padding-bottom:0; border:none;">
            <span class="brand-badge">&lt;/&gt;</span>
            <span class="brand-title">CodeOrbit</span>
        </a>

        <a href="index.html" class="btn-ghost-dark">
            ← Back to Home
        </a>
    </header>

    <main class="auth-main-wrap">
        <div class="auth-card-container" style="max-width: 540px;">
            <div class="auth-card-head">
                <div class="auth-icon-badge">✨</div>
                <h2>Join CodeOrbit</h2>
                <p>Register as a student learner and peer mentor.</p>
            </div>

            <!-- Firebase Google Sign-In Button -->
            <button type="button" class="btn-google-auth" id="googleRegisterBtn">
                <svg class="google-icon-svg" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Continue with Google
            </button>

            <!-- Divider -->
            <div class="auth-divider">
                <span>or register with college email</span>
            </div>

            <!-- Email Registration Form -->
            <form id="registrationForm">
                <div class="auth-form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" class="auth-input-field" placeholder="e.g. Khushi Verma" required>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                    <div class="auth-form-group">
                        <label for="email">College Email</label>
                        <input type="email" id="email" class="auth-input-field" placeholder="student@college.edu" required>
                    </div>

                    <div class="auth-form-group">
                        <label for="phone">Mobile Number</label>
                        <input type="tel" id="phone" class="auth-input-field" placeholder="10-digit number" required>
                    </div>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                    <div class="auth-form-group">
                        <label for="college">College Name</label>
                        <input type="text" id="college" class="auth-input-field" placeholder="e.g. Vidya University" required>
                    </div>

                    <div class="auth-form-group">
                        <label for="course">Branch / Course</label>
                        <select id="course" class="auth-select-field" required>
                            <option value="">Select Branch</option>
                            <option value="CSE" selected>Computer Science (CSE)</option>
                            <option value="IT">Information Technology (IT)</option>
                            <option value="AI/ML">AI & Data Science</option>
                            <option value="ECE">Electronics (ECE)</option>
                            <option value="Other">Other Branch</option>
                        </select>
                    </div>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                    <div class="auth-form-group">
                        <label for="year">Current Year</label>
                        <select id="year" class="auth-select-field" required>
                            <option value="">Select Year</option>
                            <option value="1st Year">1st Year</option>
                            <option value="2nd Year">2nd Year</option>
                            <option value="3rd Year" selected>3rd Year</option>
                            <option value="4th Year">4th Year</option>
                        </select>
                    </div>

                    <div class="auth-form-group">
                        <label for="skill">Primary Skill to Share</label>
                        <select id="skill" class="auth-select-field" required>
                            <option value="">Select Skill</option>
                            <option value="Web Development" selected>Web Development</option>
                            <option value="Python Programming">Python Programming</option>
                            <option value="Data Structures & Algorithms">Data Structures & Algorithms</option>
                            <option value="UI/UX Design">UI/UX Design</option>
                            <option value="Machine Learning">Machine Learning</option>
                            <option value="Data Analytics">Data Analytics</option>
                        </select>
                    </div>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                    <div class="auth-form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="auth-input-field" placeholder="Min. 6 characters" minlength="6" required>
                    </div>

                    <div class="auth-form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" class="auth-input-field" placeholder="Re-enter password" minlength="6" required>
                    </div>
                </div>

                <div class="auth-options-row">
                    <label class="auth-checkbox-label">
                        <input type="checkbox" id="terms" required checked> I agree to the CodeOrbit Community Terms & Honor Code.
                    </label>
                </div>

                <button type="submit" class="btn-primary auth-submit-btn">
                    Create My Student Account →
                </button>

                <p class="auth-switch-link">
                    Already have an account? <a href="login.html">Login Here</a>
                </p>
            </form>
        </div>
    </main>

    <!-- Modern Firebase Auth Controller -->
    <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
