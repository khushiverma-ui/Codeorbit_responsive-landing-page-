<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeOrbit | Student Login</title>
    <link rel="stylesheet" href="assets/css/design-system.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>

<body class="auth-body">

    <!-- Auth Navigation Header -->
    <header class="auth-nav-header">
        <a href="index.html" class="app-brand" style="margin-bottom:0; padding-bottom:0; border:none;">
            <span class="brand-badge">&lt;/&gt;</span>
            <span class="brand-title">CodeOrbit</span>
        </a>

        <a href="index.html" class="btn-ghost-dark">
            ← Back to Home
        </a>
    </header>

    <main class="auth-main-wrap">
        <div class="auth-card-container">
            <div class="auth-card-head">
                <div class="auth-icon-badge">🎓</div>
                <h2>Student Login</h2>
                <p>Sign in to access your skills, sessions, and community.</p>
            </div>

            <!-- Firebase Google Sign-In Button -->
            <button type="button" class="btn-google-auth" id="googleLoginBtn">
                <svg class="google-icon-svg" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Continue with Google
            </button>

            <!-- Divider -->
            <div class="auth-divider">
                <span>or with college email</span>
            </div>

            <!-- Email / Password Form -->
            <form id="loginForm">
                <div class="auth-form-group">
                    <label for="email">College Email Address</label>
                    <input type="email" id="email" class="auth-input-field" placeholder="student@college.edu" required>
                </div>

                <div class="auth-form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="auth-input-field" placeholder="Enter your password" required>
                </div>

                <div class="auth-options-row">
                    <label class="auth-checkbox-label">
                        <input type="checkbox" id="rememberMe"> Remember Me
                    </label>
                    <a href="#" id="forgotPassword" style="color:var(--primary); font-weight:500;">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-primary auth-submit-btn" id="loginButton">
                    Login to CodeOrbit →
                </button>

                <p class="auth-switch-link">
                    Don't have an account? <a href="register.html">Register Now</a>
                </p>
            </form>
        </div>
    </main>

    <!-- Modern Firebase Auth Controller -->
    <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
